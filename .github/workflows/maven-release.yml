name: Release Maven

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Version to use when preparing a release (e.g., 0.1.0)"
        required: true
      developmentVersion:
        description: "Next development version (e.g., 0.1.1-SNAPSHOT)"
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-maven:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TZ: Europe/Berlin
      MAVEN_OPTS: "-Dhttp.socket.timeout=1800000 -Dhttp.connection.timeout=1800000"
    outputs:
      MVN_ARTIFACT_ID: ${{ steps.maven-release-step.outputs.MVN_ARTIFACT_ID }}
      ARTIFACT_NAME: ${{ steps.maven-release-step.outputs.artifact-name }}
    steps:
      - id: maven-release-step
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-release@4ed8f906bab8111fbd9a7af8e3f4129f9b721757 # v1.2.3
        with:
          app-path: "" # root module: keeps -f ./pom.xml and cache path ./pom.xml (avoid ".")
          java-version: "21" # skip pom grep; empty app-path would resolve to /pom.xml there
          releaseVersion: ${{ inputs.releaseVersion }}
          developmentVersion: ${{ inputs.developmentVersion }}
          skipDeployment: "false"
          use-pr: "true"
          SIGN_KEY_PASS: ${{ secrets.gpg_passphrase }}
          CENTRAL_USERNAME: ${{ secrets.sonatype_username }}
          CENTRAL_PASSWORD: ${{ secrets.sonatype_password }}
          GPG_PRIVATE_KEY: ${{ secrets.gpg_private_key }}

  create-github-release:
    needs: release-maven
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-create-github-release@4ed8f906bab8111fbd9a7af8e3f4129f9b721757 # v1.2.3
        with:
          artifact-name: ${{ needs.release-maven.outputs.ARTIFACT_NAME }}
          tag-name: v${{ inputs.releaseVersion }}
          artifact-path: |
            core/target/*.jar
            rest/target/*.jar
            web/target/*.jar

  # GITHUB_TOKEN-created releases do not trigger workflow `release` events, so notify
  # explicitly after the GitHub release exists.
  notify-webex:
    needs: create-github-release
    uses: ./.github/workflows/release-webex-notify.yml
    with:
      version: ${{ inputs.releaseVersion }}
    secrets:
      WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
      WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
