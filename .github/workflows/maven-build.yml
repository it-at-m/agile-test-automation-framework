name: Build

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: Europe/Berlin
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@9bde6576151908ace5f517ca623fea3b98600cb7 # v1.6.5
      - uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@9bde6576151908ace5f517ca623fea3b98600cb7 # v1.6.5
        with:
          app-path: ""
          java-version: "21"
