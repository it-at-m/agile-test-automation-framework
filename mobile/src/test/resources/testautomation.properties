# Test configuration of the ATAF mobile module.
# Unit tests replace the Appium server with test doubles and only need these values to be valid.
# The opt-in device smoke test (-Dataf.it.mobile.enabled=true) starts a real session with them;
# pass the device serial with -Dtestautomation.mobile.udid=<adb serial>.
testautomation.logLevel=INFO
testautomation.mobile.appiumServerUrl=http://127.0.0.1:4723
# The Settings app exists on every Android device.
testautomation.mobile.appPackage=com.android.settings
testautomation.mobile.appActivity=.Settings
# Keep the data of the Settings app untouched.
testautomation.mobile.additionalCapabilities={"appium:noReset":true}
testautomation.mobile.newCommandTimeoutSeconds=60
testautomation.mobile.explicitWaitSeconds=10
