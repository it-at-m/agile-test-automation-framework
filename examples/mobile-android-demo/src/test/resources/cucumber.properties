# Disables publishing of test reports
cucumber.publish.enabled=false
cucumber.publish.quiet=true

# Path to the feature files (a file system path, as ATAF's runner lifecycle expects)
cucumber.features=src/test/resources/features

# ATAF mobile hooks and the step definitions of this example
cucumber.glue=ataf.mobile.steps,example.mobile.apidemos.steps

# Machine-readable results for CI: Cucumber JSON, JUnit XML and an HTML report
cucumber.plugin=json:target/cucumber-reports/cucumber.json,junit:target/cucumber-reports/cucumber.xml,html:target/cucumber-reports/cucumber.html

# Only mobile scenarios
cucumber.filter.tags=@mobile
