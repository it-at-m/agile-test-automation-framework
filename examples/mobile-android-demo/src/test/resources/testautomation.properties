# Configuration of the ApiDemos example. Every value can be overridden with a -D system property.
testautomation.logLevel=INFO

# Appium 3 server. Append the base path if the server was started with --base-path.
testautomation.mobile.appiumServerUrl=http://127.0.0.1:4723

# Device serial as listed by "adb devices". Pass it per run: -Dtestautomation.mobile.udid=<serial>
#testautomation.mobile.udid=

# Appium's public ApiDemos app (npm package android-apidemos@5.0.0, Apache-2.0).
# Install it per run with -Dtestautomation.mobile.app=/path/to/ApiDemos-debug.apk or beforehand with "adb install".
testautomation.mobile.appPackage=io.appium.android.apis
testautomation.mobile.appActivity=.ApiDemos

testautomation.mobile.newCommandTimeoutSeconds=120
testautomation.mobile.explicitWaitSeconds=20
testautomation.mobile.screenshotOnFailure=true
# The demo app shows no sensitive data, so the UI hierarchy is attached to failed scenarios as well.
testautomation.mobile.pageSourceOnFailure=true

# Required by ATAF's runner lifecycle (RunnerUtils.setupTestSuite) to decrypt test data. The example
# uses no encrypted test data, so this placeholder is never used; real projects pass their password at runtime.
testautomation.secret.testDataEncryptionPassword=not-used-by-the-apidemos-example
